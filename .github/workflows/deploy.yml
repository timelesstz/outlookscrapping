name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/ecstatic-pasteur-w4fot3]
  workflow_dispatch:

# Publishing to a gh-pages branch: pushing that branch makes GitHub enable
# Pages for it automatically, with no manual Settings step. The
# actions/deploy-pages flow can't do that (the workflow token may not
# create the Pages site).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
